services:
  - type: web
    name: discord-verify-site
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: WEB_SECRET_KEY
        generateValue: true
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_TOKEN
        sync: false
      - key: DEV_GUILD_ID
        sync: false
      - key: VERIFY_ROLE_ID
        sync: false
      - key: OAUTH_REDIRECT_URI
        sync: false
